<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revenue – Crestline</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap"><a class="back" href="../index.html">Back to Crestline</a>
<h1>Revenue</h1><p class="sub">Revenue analytics. Pick a range and see how daily revenue changed.</p>
<div class="card"><div class="row"><div><div class="sub" style="margin:0">Total revenue</div><div class="big" id="total">0</div><div id="delta"></div></div>
<div class="seg" role="group" aria-label="Date range"><button data-n="7" aria-pressed="false">7 days</button><button data-n="30" aria-pressed="true">30 days</button><button data-n="90" aria-pressed="false">90 days</button></div></div>
<div class="chart" id="chart" role="img" aria-label="Daily revenue bar chart"></div><div class="read" id="read" aria-live="polite">Hover a bar to see its day.</div></div>
</div><script src="../shared/ask-gemini.js"></script><script src="script.js"></script></body></html>
